<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/app.css"/>
    <link rel="stylesheet" href="/src/index.css"/>
    <title>neuro6x</title>
  </head>
  <body>
   <!--  <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>  -->
    <div id="app">
      <header class="hud">
    <div class="brand">ACUITY <span>LAB</span><small>COGNITIVE CALIBRATION INSTRUMENT</small></div>
    <div class="level-track" id="levelTrack"></div>
    <div class="dial-wrap">
      <svg id="dial" viewBox="0 0 200 120">
        <path d="M 20 110 A 90 90 0 0 1 180 110" fill="none" stroke="rgba(236,233,223,0.12)" stroke-width="10" stroke-linecap="round"/>
        <path id="dialArc" d="M 20 110 A 90 90 0 0 1 180 110" fill="none" stroke="var(--signal)" stroke-width="10" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"/>
        <line x1="20" y1="110" x2="30" y2="110" stroke="rgba(236,233,223,0.3)" stroke-width="2" transform="rotate(-90 100 110)"/>
        <line x1="20" y1="110" x2="30" y2="110" stroke="rgba(236,233,223,0.3)" stroke-width="2" transform="rotate(-45 100 110)"/>
        <line x1="20" y1="110" x2="30" y2="110" stroke="rgba(236,233,223,0.3)" stroke-width="2" transform="rotate(0 100 110)"/>
        <line x1="20" y1="110" x2="30" y2="110" stroke="rgba(236,233,223,0.3)" stroke-width="2" transform="rotate(45 100 110)"/>
        <line x1="20" y1="110" x2="30" y2="110" stroke="rgba(236,233,223,0.3)" stroke-width="2" transform="rotate(90 100 110)"/>
        <circle cx="100" cy="110" r="5" fill="var(--ink)"/>
        <g id="needle">
          <line x1="100" y1="110" x2="100" y2="34" stroke="var(--signal)" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="dial-label mono" id="dialLabel">STANDBY</div>
    </div>
  </header>

    </div>
  </body>
</html>
